apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kasten-alerting
  labels:
    {{- include "kasten-alerting.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: kasten-alerting
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: kasten-alerting
  apiGroup: rbac.authorization.k8s.io
